name: Reusable PR Check Label

on:
  workflow_call:
    inputs:
      script-ref:
        description: Trusted branch, tag, or SHA in medik8s/.github containing the script
        type: string
        default: main
      label-name:
        description: Label maintained on PRs whose reported CI checks all pass
        type: string
        default: all-checks-passed
      ignored-checks:
        description: JSON array of exact check names or status contexts to ignore
        type: string
        default: '["tide"]'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  label-on-success:
    # Keep this name in callers too; the script excludes its own check.
    name: Update CI label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out shared label script
        uses: actions/checkout@v4
        with:
          repository: medik8s/.github
          ref: ${{ inputs.script-ref }}
          path: shared-pr-label
          sparse-checkout: scripts/pr-check-label.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          LABEL_NAME: ${{ inputs.label-name }}
          IGNORED_CHECKS: ${{ inputs.ignored-checks }}
        with:
          script: |
            const updateLabel = require('./shared-pr-label/scripts/pr-check-label.cjs');
            await updateLabel({github, context, core});
