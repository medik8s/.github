# Reusable CI workflow for medik8s operators hosted in medik8s/.github.
#
# Runs four parallel jobs: verify, unit-test, container-build, and scorecard.
# Detects available Makefile targets dynamically and skips gracefully
# when a target is missing.

# In each repo that will use this workflow add the following workflow file:
#
#
# name: CI
#
# on:
#   push:
#     branches: ['**']
#   pull_request:
#     branches: ['**']
#
# jobs:
#   ci:
#     uses: medik8s/.github/.github/workflows/ci.yaml@main

name: CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Optional Go version override if go.mod is not automatically detected'
        type: string
        required: false
        default: ''
      kind-version:
        description: 'Kind version for scorecard tests'
        type: string
        required: false
        default: 'v0.33.0'
      k8s-version:
        description: 'Kubernetes version for scorecard tests'
        type: string
        required: false
        default: 'v1.37.0'

permissions:
  contents: read

jobs:
  verify:
    name: Lint & Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run go vet
        run: |
          set -euo pipefail
          if make -n vet >/dev/null 2>&1; then
            make vet
          else
            echo "::notice::go vet skipped (no vet target)"
          fi

      - name: Check import sorting
        run: |
          set -euo pipefail
          if make -n test-imports >/dev/null 2>&1; then
            make test-imports
          else
            echo "::notice::Import sorting skipped (no test-imports target)"
          fi

      - name: Verify vendor
        run: |
          set -euo pipefail
          if make -n verify-vendor >/dev/null 2>&1; then
            make verify-vendor
          else
            go mod tidy
            go mod vendor
            if ! git diff --quiet go.mod go.sum vendor/ || [ -n "$(git ls-files -o --exclude-standard vendor/)" ]; then
              echo "::error::go.mod, go.sum or vendor/ is out of sync"
              git diff --stat go.mod go.sum vendor/
              git ls-files -o --exclude-standard vendor/
              exit 1
            fi
          fi
          go mod verify

      - name: Verify bundle
        run: |
          set -euo pipefail
          has_target() { make -n "$1" >/dev/null 2>&1; }

          if has_target verify-bundle; then
            make verify-bundle
          elif has_target manifests && has_target bundle-reset; then
            make manager manifests bundle-k8s bundle-reset
            if has_target verify; then
              make verify
            fi
          else
            echo "::notice::Bundle verification skipped (no verify targets)"
          fi

  unit-test:
    name: Unit Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run unit tests
        run: |
          set -euo pipefail
          if make -n test >/dev/null 2>&1; then
            make test
          else
            echo "::notice::Unit tests skipped (no test target)"
          fi

  container-build:
    name: Container Build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Build container images
        env:
          NHC_SKIP_TEST: "true"
        run: |
          set -euo pipefail
          has_target() { make -n "$1" >/dev/null 2>&1; }
          built=false

          for target in container-build-k8s container-build-ocp container-build-community container-build-metrics; do
            if has_target "$target"; then
              echo "=== Building: $target ==="
              make "$target"
              built=true
            fi
          done

          if [ "$built" = false ]; then
            if has_target docker-build; then
              echo "=== Building: docker-build ==="
              make docker-build
            else
              echo "::notice::Container build skipped (no build target)"
            fi
          fi

  scorecard:
    name: OLM Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Check if scorecard is needed
        id: check
        run: |
          set -euo pipefail
          if make -n test-scorecard >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scorecard tests skipped (no test-scorecard target)"
          fi

      - name: Start kind cluster
        if: steps.check.outputs.run == 'true'
        uses: helm/kind-action@v1
        with:
          version: ${{ inputs.kind-version }}
          node_image: kindest/node:${{ inputs.k8s-version }}
          kubectl_version: ${{ inputs.k8s-version }}
          registry: true

      - name: Create operator namespace
        if: steps.check.outputs.run == 'true'
        run: kubectl create namespace openshift-workload-availability --dry-run=client -o yaml | kubectl apply -f -

      - name: Run scorecard tests
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          make test-scorecard
