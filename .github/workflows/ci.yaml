# Reusable CI workflow for medik8s operators hosted in medik8s/.github.
#
# Runs these parallel jobs: verify, unit-test, container-build,
# validate-multiarch (plus its multiarch-gate aggregate), and scorecard.
# Detects available Makefile targets dynamically and skips gracefully when a
# target is missing.

# In each repo that will use this workflow add the following workflow file:
#
#
# name: CI
#
# on:
#   push:
#     branches: ['**']
#   pull_request:
#     branches: ['**']
#
# jobs:
#   ci:
#     uses: medik8s/.github/.github/workflows/ci.yaml@main

name: CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Optional Go version override if go.mod is not automatically detected'
        type: string
        required: false
        default: ''
      kind-version:
        description: 'Kind version for scorecard tests'
        type: string
        required: false
        default: 'v0.33.0'
      k8s-version:
        description: 'Kubernetes version for scorecard tests'
        type: string
        required: false
        default: 'v1.37.0'

permissions:
  contents: read

jobs:
  verify:
    name: Lint & Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run go vet
        run: |
          set -euo pipefail
          if make -n vet >/dev/null 2>&1; then
            make vet
          else
            echo "::notice::go vet skipped (no vet target)"
          fi

      - name: Check import sorting
        run: |
          set -euo pipefail
          if make -n test-imports >/dev/null 2>&1; then
            make test-imports
          else
            echo "::notice::Import sorting skipped (no test-imports target)"
          fi

      - name: Verify vendor
        run: |
          set -euo pipefail
          if make -n verify-vendor >/dev/null 2>&1; then
            make verify-vendor
          else
            go mod tidy
            go mod vendor
            if ! git diff --quiet go.mod go.sum vendor/ || [ -n "$(git ls-files -o --exclude-standard vendor/)" ]; then
              echo "::error::go.mod, go.sum or vendor/ is out of sync"
              git diff --stat go.mod go.sum vendor/
              git ls-files -o --exclude-standard vendor/
              exit 1
            fi
          fi
          go mod verify

      - name: Verify bundle
        run: |
          set -euo pipefail
          has_target() { make -n "$1" >/dev/null 2>&1; }

          if has_target verify-bundle; then
            make verify-bundle
          elif has_target manifests && has_target bundle-reset; then
            make manager manifests bundle-k8s bundle-reset
            if has_target verify; then
              make verify
            fi
          else
            echo "::notice::Bundle verification skipped (no verify targets)"
          fi

  unit-test:
    name: Unit Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run unit tests
        run: |
          set -euo pipefail
          if make -n test >/dev/null 2>&1; then
            make test
          else
            echo "::notice::Unit tests skipped (no test target)"
          fi

      - name: Validate multiarch OLM bundle
        run: |
          set -euo pipefail
          # Only validate repos that declare arch support in their bundle.
          if ! grep -rl 'operatorframework\.io/arch\.' bundle/manifests/ >/dev/null 2>&1; then
            echo "::notice::Multiarch OLM validation skipped (no arch labels in bundle)"
            exit 0
          fi
          # Install operator-sdk via the Makefile target so we reuse the cached binary.
          make operator-sdk
          SDK=$(find bin -name 'operator-sdk' -type f | head -1)
          if [[ -z "$SDK" ]]; then
            echo "::error::operator-sdk binary not found under bin/ after 'make operator-sdk'"
            exit 1
          fi
          # The validator tries to docker-pull the image to cross-check platforms.
          # In PR CI the image does not exist yet; the validator still exits 0 for
          # image-pull failures (they surface as warnings, not errors). Real OLM
          # schema violations cause a non-zero exit and fail CI.
          # Run after verify-unchanged has already passed so CSV mutations don't break CI.
          "$SDK" bundle validate ./bundle --select-optional name=multiarch
          # Restore any mutations the validator wrote to the CSV.
          git checkout -- bundle/manifests/ 2>/dev/null || true

  container-build:
    name: Container Build
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      # No QEMU here on purpose: every container-build-*/docker-build target in
      # the medik8s operators builds for the runner's native linux/amd64 only.
      # If a repo ever points one of them at a non-native platform, add QEMU
      # back or the build will fail with "exec format error".
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container images
        env:
          NHC_SKIP_TEST: "true"
        run: |
          set -euo pipefail
          has_target() { make -n "$1" >/dev/null 2>&1; }
          built=false

          for target in container-build-k8s container-build-ocp container-build-community container-build-metrics; do
            if has_target "$target"; then
              echo "=== Building: $target ==="
              make "$target"
              built=true
            fi
          done

          if [ "$built" = false ]; then
            if has_target docker-build; then
              echo "=== Building: docker-build ==="
              make docker-build
            else
              echo "::notice::Container build skipped (no build target)"
            fi
          fi

  # Split out of container-build so the slow emulated builds no longer gate the
  # "Container Build" required status check. One runner per platform: the four
  # used to share a single runner, which made them time out.
  #
  # The per-platform contexts are named after the matrix leg, so their names
  # change whenever the platform list does. Gate on the "Multi-arch Validation"
  # aggregate below instead of on these four directly.
  validate-multiarch:
    name: Validate Dockerfile (${{ matrix.platform }})
    runs-on: ubuntu-26.04
    # The builder stage of the operator Dockerfiles is not pinned to
    # $BUILDPLATFORM, so a non-amd64 build compiles Go under full QEMU
    # emulation. Budget accordingly until the Dockerfiles cross-compile.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/ppc64le
          - linux/s390x
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Checked before the QEMU/buildx setup so repos without the target cost
      # a few seconds instead of a few minutes.
      - name: Check if multi-platform validation is needed
        id: check
        run: |
          set -euo pipefail
          if make -n docker-buildx >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Multi-platform build skipped (no docker-buildx target)"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.run == 'true' && matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Validate platform build
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "=== Validating build for ${{ matrix.platform }} ==="
          docker buildx build \
            --platform=${{ matrix.platform }} \
            --output type=image,push=false \
            -f Dockerfile .

  # Single stable status context that succeeds only once every platform leg has
  # succeeded. Because the matrix uses fail-fast: false, the aggregated result
  # is "success" only when none of the four failed or were cancelled.
  #
  # Add "ci / Multi-arch Validation" to branch protection as a required check.
  # It replaces the merge gate that the multi-platform build used to get for
  # free by living inside "Container Build", and unlike the four per-platform
  # contexts its name is stable across changes to the platform list.
  multiarch-gate:
    name: Multi-arch Validation
    needs: validate-multiarch
    # Must still report when a matrix leg fails, otherwise a required check
    # that never reports would block every PR.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check per-platform results
        env:
          RESULT: ${{ needs.validate-multiarch.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success)
              echo "All platform builds succeeded."
              ;;
            skipped)
              # Repos without a docker-buildx target skip the build at step
              # level, so this is a pass, not a missing result.
              echo "::notice::Multi-arch validation was skipped."
              ;;
            *)
              echo "::error::Multi-arch validation did not pass (result: $RESULT)"
              exit 1
              ;;
          esac

  scorecard:
    name: OLM Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Check if scorecard is needed
        id: check
        run: |
          set -euo pipefail
          if make -n test-scorecard >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scorecard tests skipped (no test-scorecard target)"
          fi

      - name: Start kind cluster
        if: steps.check.outputs.run == 'true'
        uses: helm/kind-action@v1
        with:
          version: ${{ inputs.kind-version }}
          node_image: kindest/node:${{ inputs.k8s-version }}
          kubectl_version: ${{ inputs.k8s-version }}
          registry: true

      - name: Create operator namespace
        if: steps.check.outputs.run == 'true'
        run: kubectl create namespace openshift-workload-availability --dry-run=client -o yaml | kubectl apply -f -

      - name: Run scorecard tests
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          make test-scorecard
