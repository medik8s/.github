# Reusable CI workflow for medik8s operators hosted in medik8s/.github.
#
# Runs five parallel jobs: verify, unit-test, container-build, scorecard, and
# pr-description. Detects available Makefile targets dynamically and skips
# gracefully when a target is missing.

# In each repo that will use this workflow add the following workflow file.
# The `edited` and `labeled`/`unlabeled` PR types let the description check
# re-run when an author fixes the description or a maintainer applies the
# skip label, and `pull-requests: write` lets it ask CodeRabbit for a test
# plan. See docs/pr-description-check.md.
#
#
# name: CI
#
# on:
#   push:
#     branches: ['**']
#   pull_request:
#     branches: ['**']
#     types: [opened, reopened, synchronize, edited, labeled, unlabeled]
#
# permissions:
#   contents: read
#   pull-requests: write
#
# jobs:
#   ci:
#     uses: medik8s/.github/.github/workflows/ci.yaml@main

name: CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Optional Go version override if go.mod is not automatically detected'
        type: string
        required: false
        default: ''
      kind-version:
        description: 'Kind version for scorecard tests'
        type: string
        required: false
        default: 'v0.33.0'
      k8s-version:
        description: 'Kubernetes version for scorecard tests'
        type: string
        required: false
        default: 'v1.37.0'
      script-ref:
        description: 'Trusted branch, tag, or SHA in medik8s/.github containing the shared scripts'
        type: string
        required: false
        default: 'main'
      description-min-words:
        description: 'Words a PR template section must have when it carries no issue reference'
        type: number
        required: false
        default: 15
      jira-projects:
        description: 'Comma-separated Jira project keys accepted as an issue reference'
        type: string
        required: false
        default: 'RHWA,OCPBUGS'
      description-skip-label:
        description: 'Label that bypasses the PR description check'
        type: string
        required: false
        default: 'skip-pr-description-check'

permissions:
  contents: read

jobs:
  verify:
    name: Lint & Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run go vet
        run: |
          set -euo pipefail
          if make -n vet >/dev/null 2>&1; then
            make vet
          else
            echo "::notice::go vet skipped (no vet target)"
          fi

      - name: Check import sorting
        run: |
          set -euo pipefail
          if make -n test-imports >/dev/null 2>&1; then
            make test-imports
          else
            echo "::notice::Import sorting skipped (no test-imports target)"
          fi

      - name: Verify vendor
        run: |
          set -euo pipefail
          if make -n verify-vendor >/dev/null 2>&1; then
            make verify-vendor
          else
            go mod tidy
            go mod vendor
            if ! git diff --quiet go.mod go.sum vendor/ || [ -n "$(git ls-files -o --exclude-standard vendor/)" ]; then
              echo "::error::go.mod, go.sum or vendor/ is out of sync"
              git diff --stat go.mod go.sum vendor/
              git ls-files -o --exclude-standard vendor/
              exit 1
            fi
          fi
          go mod verify

      - name: Verify bundle
        run: |
          set -euo pipefail
          has_target() { make -n "$1" >/dev/null 2>&1; }

          if has_target verify-bundle; then
            make verify-bundle
          elif has_target manifests && has_target bundle-reset; then
            make manager manifests bundle-k8s bundle-reset
            if has_target verify; then
              make verify
            fi
          else
            echo "::notice::Bundle verification skipped (no verify targets)"
          fi

  unit-test:
    name: Unit Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run unit tests
        run: |
          set -euo pipefail
          if make -n test >/dev/null 2>&1; then
            make test
          else
            echo "::notice::Unit tests skipped (no test target)"
          fi

      - name: Validate multiarch OLM bundle
        run: |
          set -euo pipefail
          # Only validate repos that declare arch support in their bundle.
          if ! grep -rl 'operatorframework\.io/arch\.' bundle/manifests/ >/dev/null 2>&1; then
            echo "::notice::Multiarch OLM validation skipped (no arch labels in bundle)"
            exit 0
          fi
          # Install operator-sdk via the Makefile target so we reuse the cached binary.
          make operator-sdk
          SDK=$(find bin -name 'operator-sdk' -type f | head -1)
          if [[ -z "$SDK" ]]; then
            echo "::error::operator-sdk binary not found under bin/ after 'make operator-sdk'"
            exit 1
          fi
          # The validator tries to docker-pull the image to cross-check platforms.
          # In PR CI the image does not exist yet; the validator still exits 0 for
          # image-pull failures (they surface as warnings, not errors). Real OLM
          # schema violations cause a non-zero exit and fail CI.
          # Run after verify-unchanged has already passed so CSV mutations don't break CI.
          "$SDK" bundle validate ./bundle --select-optional name=multiarch
          # Restore any mutations the validator wrote to the CSV.
          git checkout -- bundle/manifests/ 2>/dev/null || true

  container-build:
    name: Container Build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container images
        env:
          NHC_SKIP_TEST: "true"
        run: |
          set -euo pipefail
          has_target() { make -n "$1" >/dev/null 2>&1; }
          built=false

          for target in container-build-k8s container-build-ocp container-build-community container-build-metrics; do
            if has_target "$target"; then
              echo "=== Building: $target ==="
              make "$target"
              built=true
            fi
          done

          if [ "$built" = false ]; then
            if has_target docker-build; then
              echo "=== Building: docker-build ==="
              make docker-build
            else
              echo "::notice::Container build skipped (no build target)"
            fi
          fi

      - name: Validate multi-platform Dockerfile
        run: |
          set -euo pipefail
          if ! make -n docker-buildx >/dev/null 2>&1; then
            echo "::notice::Multi-platform build skipped (no docker-buildx target)"
            exit 0
          fi
          echo "=== Validating multi-platform build ==="
          docker buildx build \
            --platform=linux/amd64,linux/arm64,linux/ppc64le,linux/s390x \
            --output type=image,push=false \
            -f Dockerfile .

  scorecard:
    name: OLM Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Check if scorecard is needed
        id: check
        run: |
          set -euo pipefail
          if make -n test-scorecard >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scorecard tests skipped (no test-scorecard target)"
          fi

      - name: Start kind cluster
        if: steps.check.outputs.run == 'true'
        uses: helm/kind-action@v1
        with:
          version: ${{ inputs.kind-version }}
          node_image: kindest/node:${{ inputs.k8s-version }}
          kubectl_version: ${{ inputs.k8s-version }}
          registry: true

      - name: Create operator namespace
        if: steps.check.outputs.run == 'true'
        run: kubectl create namespace openshift-workload-availability --dry-run=client -o yaml | kubectl apply -f -

      - name: Run scorecard tests
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          make test-scorecard

  pr-description:
    name: PR Description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A plain checkout in a reusable workflow retrieves the caller
      # repository, so select medik8s/.github explicitly.
      - name: Check out shared description script
        uses: actions/checkout@v7
        with:
          repository: medik8s/.github
          ref: ${{ inputs.script-ref }}
          path: shared-pr-description
          sparse-checkout: scripts/pr-description-check.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check PR description against the template
        uses: actions/github-script@v7
        env:
          MIN_WORDS: ${{ inputs.description-min-words }}
          JIRA_PROJECTS: ${{ inputs.jira-projects }}
          SKIP_LABEL: ${{ inputs.description-skip-label }}
        with:
          script: |
            const checkDescription = require('./shared-pr-description/scripts/pr-description-check.cjs');
            await checkDescription({github, context, core});
