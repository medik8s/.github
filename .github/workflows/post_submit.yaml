name: Post Submit
# Reusable post submit job for the medik8s operators: builds the operator images
# and pushes them to the registry on every push to a branch, tagging them per
# branch, so that no branch can overwrite the images of another branch:
#
#   - the repository's default branch -> the floating "latest" tag
#   - every other branch              -> "v<version>" of that branch's Makefile
#
# The branch itself is never named here, so the calling workflow can be
# cherry-picked as is to every version branch.
on:
  workflow_call:
    inputs:
      make_targets:
        description: "The Makefile targets that build and push the images, e.g. 'container-build-k8s container-push'"
        required: true
        type: string
      make_vars:
        description: "Additional VAR=VALUE arguments for make, e.g. 'CONTAINER_TOOL=docker'"
        required: false
        default: ""
        type: string
      image_registry:
        description: "The registry to push the images to"
        required: false
        default: "quay.io/medik8s"
        type: string
      setup_go:
        description: "Set up Go before building, disable it for repositories without a go.mod"
        required: false
        default: true
        type: boolean
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  push_to_registry:
    name: Build and push images to ${{ inputs.image_registry }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        if: ${{ inputs.setup_go }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve image tag for this branch
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            tag="latest"
          else
            # Only some of the operators have a 'print-image-tag' target, so fall
            # back to asking make for IMAGE_TAG through a target injected on the fly.
            if ! tag="$(make -s print-image-tag 2>/dev/null)" || [ -z "${tag}" ]; then
              tag="$(make -s -f Makefile -f <(printf 'medik8s-ci-print-image-tag:\n\t@echo $(IMAGE_TAG)\n') medik8s-ci-print-image-tag)"
            fi
            if [ -z "${tag}" ]; then
              echo "::error::Could not determine the image tag of branch '${GITHUB_REF_NAME}'. Does its Makefile define IMAGE_TAG?"
              exit 1
            fi
            if [ "${tag}" = "latest" ] || [ "${tag}" = "v0.0.1" ]; then
              echo "::error::Branch '${GITHUB_REF_NAME}' resolved to the placeholder image tag '${tag}': 'latest' is reserved for the '${DEFAULT_BRANCH}' branch, and 'v0.0.1' is the unset default version. Set DEFAULT_VERSION in the Makefile of this branch to the version of the branch before publishing, and drop the legacy 'ifeq (\$(VERSION), \$(DEFAULT_VERSION))' guard that maps it to 'latest'."
              exit 1
            fi
          fi
          echo "Publishing images of branch '${GITHUB_REF_NAME}' with tag '${tag}'"
          echo "image_tag=${tag}" >> "${GITHUB_OUTPUT}"
          # the login action wants the host only, not the whole image base URL
          echo "registry_host=${IMAGE_REGISTRY%%/*}" >> "${GITHUB_OUTPUT}"

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: ${{ steps.resolve.outputs.registry_host }}

      - name: Build and push images
        env:
          MAKE_TARGETS: ${{ inputs.make_targets }}
          MAKE_VARS: ${{ inputs.make_vars }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        # IMAGE_TAG has to be passed on the command line: the operator Makefiles
        # assign it unconditionally, so an environment variable would be ignored.
        run: |
          set -euo pipefail
          echo "Running: make ${MAKE_TARGETS} IMAGE_REGISTRY=${IMAGE_REGISTRY} IMAGE_TAG=${IMAGE_TAG} ${MAKE_VARS}"
          make ${MAKE_TARGETS} IMAGE_REGISTRY="${IMAGE_REGISTRY}" IMAGE_TAG="${IMAGE_TAG}" ${MAKE_VARS}
