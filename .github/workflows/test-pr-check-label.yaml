# Formatting, type, and behavior checks for every shared script in scripts/.
# The workflow name is kept for continuity with existing check references.
name: Test PR Check Label

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/*pr*label*.yaml'
      - 'scripts/*.cjs'
      - 'tests/*.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.prettierrc.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/*pr*label*.yaml'
      - 'scripts/*.cjs'
      - 'tests/*.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.prettierrc.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
